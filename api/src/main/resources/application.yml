spring:
  application:
    name: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobqueue}
    username: ${DB_USER:jobqueue}
    password: ${DB_PASSWORD:jobqueue}

server:
  port: 8080
  error:
    include-message: always  # our exception messages are written for API clients

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: api
    distribution:
      percentiles-histogram:
        http.server.requests: true

jobqueue:
  stats-refresh-interval: 5s
