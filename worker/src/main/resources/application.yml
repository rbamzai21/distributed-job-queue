spring:
  application:
    name: worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobqueue}
    username: ${DB_USER:jobqueue}
    password: ${DB_PASSWORD:jobqueue}
    hikari:
      # One connection for the claim loop, heartbeat and reaper, plus one per in-flight job finishing up.
      maximum-pool-size: ${WORKER_DB_POOL_SIZE:12}
  task:
    scheduling:
      pool:
        size: 2  # reaper and (in Redis mode) the delayed-job promoter, so neither waits on the other

server:
  port: 8081  # actuator only: health and the Prometheus scrape endpoint

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: worker

worker:
  queue-mode: ${QUEUE_MODE:postgres}
  concurrency: ${WORKER_CONCURRENCY:8}
  batch-size: ${WORKER_BATCH_SIZE:10}
  poll-interval: ${WORKER_POLL_INTERVAL:500ms}
  lease-duration: 30s
  heartbeat-interval: 10s
  reaper-interval: 5s
  backoff-base: 1s
  backoff-max: 5m
  shutdown-timeout: 30s
  redis-url: ${REDIS_URL:redis://localhost:6379}
  redis-sweep-interval: 5s
  promote-interval: 100ms
